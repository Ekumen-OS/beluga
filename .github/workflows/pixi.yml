name: CI pipeline (Pixi)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  pixi:
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    strategy:
      fail-fast: false
      matrix:
        distro:
          # - humble  # gtest <cstdint> issue
          - jazzy
          - kilted
          - lyrical
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup compiler cache
        uses: Chocobo1/setup-ccache-action@v1
        with:
          api_token: ${{ secrets.GITHUB_TOKEN }}
          update_packager_index: false
          override_cache_key: ccache-pixi-${{ matrix.distro }}

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.80.0
          cache: false
          run-install: false  # No pixi.toml in this repo
          global-environments: |
            ccache
            pixi-ros
      - name: pixi-ros init
        run: pixi-ros init --distro ${{ matrix.distro }} --platform linux-64 --platform linux-aarch64
      - name: pixi install
        run: pixi install
      - name: pixi build
        run: pixi run build --packages-up-to beluga_amcl
      - name: pixi test
        run: pixi run test --packages-up-to beluga_amcl
