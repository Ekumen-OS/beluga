name: CI pipeline (Pixi)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  pixi:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro:
          - humble
          - jazzy
          - kilted
          - lyrical
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.80.0
          cache: false
          run-install: false  # No pixi.toml in this repo
          global-environments: |
            pixi-ros
      - name: Run Pixi tests
        run: |-
          pixi-ros init --distro ${{ matrix.distro }} --platform linux-64 --platform linux-aarch64
          pixi install
          pixi run build
          pixi run test
