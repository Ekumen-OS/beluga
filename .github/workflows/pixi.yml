name: CI pipeline (Pixi)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.80.0
          cache: false
          run-install: false  # No pixi.toml in this repo
          global-environments: |
            pixi-ros
      - name: Run Pixi tests
        run: |-
          pixi-ros init --distro jazzy --platform linux-64
          pixi run build --packages-up-to beluga_ros  # Should become `pixi run test` in the end
